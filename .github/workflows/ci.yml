name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linking:
    name: Check workspace links
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm install --global npm@11.11.0 pnpm@11.18.0 --ignore-scripts
      - run: npm ci
      - run: npm run check:linking

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:soundness:mutations
      - run: npm run build
      - name: Check that dist matches the source
        run: git diff --exit-code -- dist

  compare:
    # The only check that calls the real compare endpoint, from the default shallow checkout of a
    # pull request's test merge. This repository's own files sit outside the fixture workspace, so
    # the expected plan fails closed on the first listed path. A pull request that changes only
    # files inside the fixture needs a different expectation.
    name: Compare the pull request merge
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: plan
        uses: ./
        with:
          working-directory: test/fixtures/acme
      - name: Expect the merge's first parent as base and a listing from the endpoint
        env:
          OUTPUTS: ${{ toJSON(steps.plan.outputs) }}
          COMPLETE: ${{ steps.plan.outputs.complete }}
          LANES: ${{ steps.plan.outputs.lanes }}
          MATRIX: ${{ steps.plan.outputs.matrix }}
          REASONS: ${{ steps.plan.outputs.reasons }}
        run: |
          printf '%s\n' "$OUTPUTS"
          first_parent=$(git cat-file -p HEAD | sed -n 's/^parent //p' | head -n 1)
          test -n "$first_parent"
          test "$COMPLETE" = false
          test "$LANES" = '["api","web","e2e","lint"]'
          printf '%s' "$MATRIX" | jq -e --arg base "$first_parent" 'all(.include[]; .base == $base)'
          printf '%s' "$REASONS" | jq -e 'all(.[]; test("is not a path inside the routed root$"))'

  dogfood:
    name: Dogfood
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: package
        name: Route a package change
        uses: ./
        with:
          working-directory: test/fixtures/acme
          files: packages/ui/src/button.tsx
      - name: Expect the lanes that read @acme/ui
        env:
          LANES: ${{ steps.package.outputs.lanes }}
          API: ${{ steps.package.outputs.api }}
          WEB: ${{ steps.package.outputs.web }}
          COMPLETE: ${{ steps.package.outputs.complete }}
          NONE_REQUIRED: ${{ steps.package.outputs.none-required }}
        run: |
          test "$LANES" = '["web","e2e","lint"]'
          test "$API" = skip
          test "$WEB" = run
          test "$COMPLETE" = true
          test "$NONE_REQUIRED" = false

      - id: docs
        name: Route a docs-only change
        uses: ./
        with:
          working-directory: test/fixtures/acme
          files: README.md
      - name: Expect no lane to be required
        env:
          LANES: ${{ steps.docs.outputs.lanes }}
          MATRIX: ${{ steps.docs.outputs.matrix }}
          DOCS_ONLY: ${{ steps.docs.outputs.docs-only }}
          NONE_REQUIRED: ${{ steps.docs.outputs.none-required }}
        run: |
          test "$LANES" = '[]'
          test "$MATRIX" = '{"include":[]}'
          test "$DOCS_ONLY" = true
          test "$NONE_REQUIRED" = true

      - id: unmatched
        name: Route a path that nothing claims
        uses: ./
        with:
          working-directory: test/fixtures/acme
          files: tsconfig.json
      - name: Expect every lane to run
        env:
          LANES: ${{ steps.unmatched.outputs.lanes }}
          LINT: ${{ steps.unmatched.outputs.lint }}
          COMPLETE: ${{ steps.unmatched.outputs.complete }}
        run: |
          test "$LANES" = '["api","web","e2e","lint"]'
          test "$LINT" = run
          test "$COMPLETE" = true
